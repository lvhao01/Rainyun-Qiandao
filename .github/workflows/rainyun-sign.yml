name: Rainyun 自动签到

on:
  schedule:
    # UTC 2:00 = 北京时间 10:00；原注释写 12 点实际是 10 点
    - cron: '0 4 * * *'  # UTC+8 12:00
  workflow_dispatch:

jobs:
  sign-in:
    # ubuntu-latest 已迁到 26.04，不再提供 Python 3.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          # 3.9 在 Ubuntu 26.04 不可用；改用 3.11/3.12
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install webdriver-manager chromedriver-binary-auto

      - name: 安装Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 确保temp目录存在
        run: mkdir -p temp

      - name: 执行签到脚本
        run: python rainyun.py
        env:
          RAINYUN_USER: ${{ secrets.RAINYUN_USER }}
          RAINYUN_PASS: ${{ secrets.RAINYUN_PASS }}

          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}

          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_NAME: ${{ secrets.SMTP_NAME }}

          BARK_PUSH: ${{ secrets.BARK_PUSH }}

          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}

          FSKEY: ${{ secrets.FSKEY }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}

          PUSH_KEY: ${{ secrets.PUSH_KEY }}

          HEADLESS: "true"
          DEBUG: "false"
          CHROMEDRIVER_PATH: "chromedriver"
          GITHUB_ACTIONS: "true"

      - name: 清理临时文件
        if: always()
        run: rm -rf temp
